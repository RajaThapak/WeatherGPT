name: Keep frontend and backend awake

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after ~15 min idle;
    # this keeps the backend (and its alert-check background loops)
    # running, and keeps the frontend from cold-starting for visitors.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf https://weathergpt-backend-p0ho.onrender.com/health || true
      - name: Ping frontend homepage
        run: curl -sf https://weathergpt-frontend-4jgw.onrender.com/ -o /dev/null || true
